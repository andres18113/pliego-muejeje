spring:
  application:
    name: pliego-backend
  datasource:
    url: ${PLIEGO_DB_URL}
    username: ${PLIEGO_DB_USERNAME}
    password: ${PLIEGO_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    create-schemas: false
    validate-on-migrate: true
    placeholders:
      PLIEGO_ADMIN_EMAIL: ${PLIEGO_ADMIN_EMAIL}
      PLIEGO_ADMIN_PASSWORD_HASH: ${PLIEGO_ADMIN_PASSWORD_HASH}
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true

pliego:
  home-delivery:
    scheduler-enabled: ${PLIEGO_HOME_DELIVERY_SCHEDULER_ENABLED:true}
    poll-interval: ${PLIEGO_HOME_DELIVERY_POLL_INTERVAL:PT10S}
    batch-size: ${PLIEGO_HOME_DELIVERY_BATCH_SIZE:100}
  mail:
    enabled: ${PLIEGO_MAIL_ENABLED:false}
    endpoint: ${PLIEGO_MAIL_ENDPOINT:}
    token: ${PLIEGO_MAIL_TOKEN:}
    from-address: ${PLIEGO_MAIL_FROM_ADDRESS:}
    from-name: ${PLIEGO_MAIL_FROM_NAME:}
    public-url: ${PLIEGO_APP_PUBLIC_URL:}
    token-secret: ${PLIEGO_MAIL_TOKEN_SECRET:${PLIEGO_JWT_SECRET}}
    allow-local-http: ${PLIEGO_MAIL_ALLOW_LOCAL_HTTP:false}
    connect-timeout: ${PLIEGO_MAIL_CONNECT_TIMEOUT:PT3S}
    request-timeout: ${PLIEGO_MAIL_REQUEST_TIMEOUT:PT10S}
    poll-interval: ${PLIEGO_MAIL_POLL_INTERVAL:PT10S}
    batch-size: ${PLIEGO_MAIL_BATCH_SIZE:5}
  auth:
    cookie-secure: ${PLIEGO_AUTH_COOKIE_SECURE:true}
  checkout:
    transfer:
      bank: ${PLIEGO_TRANSFER_BANK:Banco Guayaquil}
      beneficiary: ${PLIEGO_TRANSFER_BENEFICIARY:PLIEGO}
      account-type: ${PLIEGO_TRANSFER_ACCOUNT_TYPE:Ahorros}
      account-number: ${PLIEGO_TRANSFER_ACCOUNT_NUMBER:2557897233}
      identification: ${PLIEGO_TRANSFER_IDENTIFICATION:1751550656}
  cors:
    allowed-origins: ${PLIEGO_CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      secret: ${PLIEGO_JWT_SECRET}

server:
  error:
    include-message: never
    include-stacktrace: never
