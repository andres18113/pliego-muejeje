spring:
  application:
    name: pliego-backend
  datasource:
    url: ${PLIEGO_DB_URL}
    username: ${PLIEGO_DB_USERNAME}
    password: ${PLIEGO_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    create-schemas: false
    validate-on-migrate: true
    placeholders:
      PLIEGO_ADMIN_EMAIL: ${PLIEGO_ADMIN_EMAIL}
      PLIEGO_ADMIN_PASSWORD_HASH: ${PLIEGO_ADMIN_PASSWORD_HASH}
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true

pliego:
  cors:
    allowed-origins: ${PLIEGO_CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      secret: ${PLIEGO_JWT_SECRET}

server:
  error:
    include-message: never
    include-stacktrace: never
