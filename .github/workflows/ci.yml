name: PLIEGO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-catalog:
    name: Python catalog and cover pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cover pipeline dependencies
        run: |
          python3 -m venv .venv-covers
          .venv-covers/bin/python -m pip install --upgrade pip==26.2.2
          .venv-covers/bin/python -m pip install -r scripts/requirements-covers.txt
      - name: Run all Python catalog and cover tests
        run: .venv-covers/bin/python -m unittest discover -s scripts -p 'test_*.py'

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=low
      - name: Install and audit root dependencies
        working-directory: .
        run: |
          npm ci
          npm audit --audit-level=low
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Run Vitest
        run: npm run test
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run test:e2e -- --workers=1
      - name: Retain frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 5

  maven-verify:
    name: Maven and PostgreSQL 18 verification
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: '55432'
      PGDATABASE: pliego
      PGUSER: pliego
      PLIEGO_DB_URL: jdbc:postgresql://127.0.0.1:55432/pliego
      PLIEGO_DB_USERNAME: pliego
      PLIEGO_ADMIN_EMAIL: ci-admin@example.invalid
      PLIEGO_ADMIN_PASSWORD_HASH: smoke-placeholder-not-usable
      PLIEGO_PG18_APP_PORT: '18080'
      CHECKOUT_BASE_URL: http://127.0.0.1:18080
      PLIEGO_GATE_LOG_DIR: /tmp/pliego-ci-gates
      # Historical upgrade jobs start schemas older than the billing queue.
      PLIEGO_BILLING_ENABLED: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check Java trust roots for CVE-2026-91403
        run: java scripts/security/CheckCerts.java
      - name: Verify backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Install PostgreSQL 18 from the official PGDG repository
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          key_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$key_file"
          key_fingerprint="$(gpg --batch --show-keys --with-colons "$key_file" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ "$key_fingerprint" != B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 ]]; then
            echo "Unexpected PostgreSQL package signing key fingerprint" >&2
            exit 1
          fi
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo install -m 0644 "$key_file" \
            /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          rm -f "$key_file"
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$VERSION_CODENAME" "$(dpkg --print-architecture)" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          sudo pg_createcluster -p 55432 18 main
          sudo pg_ctlcluster 18 main start
      - name: Create a disposable PostgreSQL database and ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          {
            printf 'PGPASSWORD=%s\n' "$db_password"
            printf 'PLIEGO_DB_PASSWORD=%s\n' "$db_password"
            printf 'PLIEGO_JWT_SECRET=%s\n' "$jwt_secret"
          } >> "$GITHUB_ENV"
          export PGPASSWORD="$db_password"
          sudo -u postgres psql -p 55432 -v ON_ERROR_STOP=1 -v "ci_password=$db_password" <<'SQL'
          CREATE ROLE pliego LOGIN PASSWORD :'ci_password';
          SQL
          sudo -u postgres createdb -p 55432 --owner=pliego pliego
          psql -X -v ON_ERROR_STOP=1 -At -c "SELECT current_setting('server_version_num')::integer >= 180006" \
            | grep -qx t
      - name: Set up Node.js for live browser contracts
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install live browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run live SQL, concurrency, HTTP, Flyway, and browser gates
        env:
          PLIEGO_RUN_LIVE_BROWSER: '1'
          PLIEGO_BILLING_ENABLED: 'true'
          PLIEGO_BILLING_POLL_INTERVAL: PT0.1S
          PLIEGO_BILLING_BATCH_SIZE: '20'
        run: bash backend/src/test/postgres18/run_ci_gates.sh
      - name: Verify trusted runtime privilege boundaries without elevated application role
        run: sudo -u postgres psql -p 55432 -d pliego -v ON_ERROR_STOP=1 -f backend/src/test/postgres18/billing_runtime_privileges_gate.sql
      - name: Verify academic billing coexistence across Flyway upgrades
        shell: bash
        run: |
          sudo -u postgres createdb -p 55432 --owner=pliego pliego_billing_upgrade_ci
          PGDATABASE=pliego_billing_upgrade_ci \
            PLIEGO_DB_URL=jdbc:postgresql://127.0.0.1:55432/pliego_billing_upgrade_ci \
            timeout 180s python3 backend/src/test/postgres18/automatic_billing_upgrade_gate.py
      - name: Verify stored cédulas survive the required, correctable cédula and RUC upgrades
        shell: bash
        run: |
          sudo -u postgres createdb -p 55432 --owner=pliego pliego_identity_upgrade_ci
          PGDATABASE=pliego_identity_upgrade_ci \
            PLIEGO_DB_URL=jdbc:postgresql://127.0.0.1:55432/pliego_identity_upgrade_ci \
            timeout 180s python3 backend/src/test/postgres18/billing_identity_upgrade_gate.py
      - name: Verify transactional email with local Mailtrap stub
        shell: bash
        run: |
          sudo -u postgres createdb -p 55432 --owner=pliego pliego_mail_delivery_ci
          PGDATABASE=pliego_mail_delivery_ci \
            PLIEGO_DB_URL=jdbc:postgresql://127.0.0.1:55432/pliego_mail_delivery_ci \
            timeout 180s python3 backend/src/test/postgres18/transactional_email_http_gate.py
      - name: Verify historical monetary snapshots across Flyway upgrade
        shell: bash
        run: |
          sudo -u postgres createdb -p 55432 --owner=pliego pliego_monetary_upgrade_ci
          PGDATABASE=pliego_monetary_upgrade_ci \
            PLIEGO_DB_URL=jdbc:postgresql://127.0.0.1:55432/pliego_monetary_upgrade_ci \
            timeout 180s python3 backend/src/test/postgres18/monetary_upgrade_gate.py
      - name: Verify Ecuador zero IVA and preserved taxable history across Flyway upgrade
        shell: bash
        run: |
          sudo -u postgres createdb -p 55432 --owner=pliego pliego_ecuador_tax_upgrade_ci
          PGDATABASE=pliego_ecuador_tax_upgrade_ci \
            PLIEGO_DB_URL=jdbc:postgresql://127.0.0.1:55432/pliego_ecuador_tax_upgrade_ci \
            timeout 180s python3 backend/src/test/postgres18/ecuador_tax_upgrade_gate.py
      - name: Verify Ecuador contact policy preserves legacy contacts and delivery history
        shell: bash
        run: |
          sudo -u postgres createdb -p 55432 --owner=pliego pliego_ecuador_contact_upgrade_ci
          PGDATABASE=pliego_ecuador_contact_upgrade_ci \
            PLIEGO_DB_URL=jdbc:postgresql://127.0.0.1:55432/pliego_ecuador_contact_upgrade_ci \
            timeout 180s python3 backend/src/test/postgres18/ecuador_contact_upgrade_gate.py
      - name: Retain backend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pliego-ci-gates/
          if-no-files-found: ignore
          retention-days: 5
