<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Before any stylesheet, so nothing holds it back: the offer clock request (ADR 0058) and the API connection. -->
    <!-- pliego:early-offer-clock -->
    <meta
      name="description"
      content="Explora el catálogo público de PLIEGO por título, autor, ISBN-13 o categoría."
    />
    <meta name="theme-color" content="#faf9f6" />
    <!-- One light appearance: browsers keep native controls, scrollbars and the first paint light. -->
    <meta name="color-scheme" content="light only" />
    <!-- Header icons paint in the first view: fetch the self-hosted symbol subset alongside the CSS. -->
    <link rel="preload" href="/src/assets/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/brand/pliego-app-icon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/brand/pliego-app-icon.svg" type="image/svg+xml" />
    <title>Catálogo · PLIEGO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
